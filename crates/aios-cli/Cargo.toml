[package]
name = "aios-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aiosctl"
path = "src/main.rs"

[[bin]]
name = "ask"
path = "src/ask.rs"

[dependencies]
aios-protocol = { path = "../aios-protocol" }
aios-system = { path = "../aios-system" }
serde = "1.0"
serde_json = "1.0"
aios-session = { path = "../aios-session" }
uuid = { version = "1.0", features = ["v4"] }
zbus = { version = "5.5", features = ["blocking"] }
