[package]
name = "aios-state"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aios-protocol = { path = "../aios-protocol" }
aios-system = { path = "../aios-system" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
rusqlite = { version = "0.40", default-features = false }
libc = "0.2"

[[bin]]
name = "aios-state-check"
path = "src/main.rs"

[[bin]]
name = "aios-stated"
path = "src/state_main.rs"

[[bin]]
name = "aios-user-stated"
path = "src/user_state_main.rs"
