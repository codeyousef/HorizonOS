[package]
name = "aios-files"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aios-protocol = { path = "../aios-protocol" }
nix = { version = "0.31", features = ["user"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23"
