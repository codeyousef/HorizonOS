<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own_prefix="org.aios"/>
    <!-- Destination rules match the owning connection, including its aliases.
         Put both broad denials before any fixed path/member allowance. -->
    <deny send_destination="org.aios.System1"/>
    <deny send_destination="org.aios.Executor1"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="GetCapabilities"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="Info"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="Services"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="ServiceStatus"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="ServiceRestart"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="Hardware"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="StorageStatus"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="NetworkStatus"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="NetworkSetWifiEnabled"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="BluetoothStatus"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="BluetoothSetEnabled"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="Boots"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="BootDiagnostics"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="Logs"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="ResolveLogService"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="ResolveUserLogService"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="GetJournalEvidence"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.aios.System1" send_member="GraphStatus"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/System1" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="GetCapabilities"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="Search"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="Info"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="Installed"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="Install"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="Remove"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.aios.Packages1" send_member="UpgradePlan"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.aios.System1" send_path="/org/aios/Packages1" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="GetCapabilities"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="Prepare"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="GetPlan"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="Authorize"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="Execute"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="GetTransaction"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="CancelTransaction"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="RequestRollback"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="GuardStatus"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.aios.Executor1" send_member="GuardHeartbeat"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.freedesktop.DBus.Introspectable" send_member="Introspect"/>
    <allow send_destination="org.aios.Executor1" send_path="/org/aios/Executor1" send_interface="org.freedesktop.DBus.Peer" send_member="Ping"/>
  </policy>
  <policy user="root">
    <deny own_prefix="org.aios"/>
    <allow own="org.aios.Executor1"/>
    <allow own="org.aios.System1"/>
    <deny send_type="signal" send_interface="org.aios.System1"/>
    <deny send_type="signal" send_interface="org.aios.Packages1"/>
    <deny send_type="signal" send_interface="org.aios.Executor1"/>
  </policy>
</busconfig>
